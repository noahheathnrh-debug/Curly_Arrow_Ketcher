<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Atom symbol (stylized as a rounded rectangle) -->
  <rect x="8" y="8" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Top lone pair -->
  <circle cx="9.5" cy="3.5" r="1.5" fill="currentColor"/>
  <circle cx="14.5" cy="3.5" r="1.5" fill="currentColor"/>
  <!-- Bottom lone pair -->
  <circle cx="9.5" cy="20.5" r="1.5" fill="currentColor"/>
  <circle cx="14.5" cy="20.5" r="1.5" fill="currentColor"/>
  <!-- Left lone pair -->
  <circle cx="3.5" cy="9.5" r="1.5" fill="currentColor"/>
  <circle cx="3.5" cy="14.5" r="1.5" fill="currentColor"/>
</svg>
